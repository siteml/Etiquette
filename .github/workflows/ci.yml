name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # the suite is a plain console runner; exit code = failure count
      - name: Run tests
        run: dotnet run --project tests/Etiq.Tests --configuration Release
      # the WinForms designer cross-compiles on Linux (EnableWindowsTargeting)
      - name: Build everything
        run: dotnet build Etiquette.sln --configuration Release
