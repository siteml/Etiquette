<?xml version="1.0" encoding="UTF-8"?>
<!-- Etiquette example: Container I.D. label, 6in x 4in.
     Field set mirrors the labelprint reference app (Epicor BAQ job row). -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="6in" height="4in" viewBox="0 0 6000 4000">
  <metadata>
    <etiq:label xmlns:etiq="urn:etiquette:label:0.1">
      <etiq:field name="JobNum"   source="prompt" caption="Job Number:" mask=""/>
      <etiq:field name="PartNo"   source="epicor" column="JobAsmbl_PartNum"/>
      <etiq:field name="Customer" source="epicor" column="JobAsmbl_Description"/>
      <etiq:field name="Rev"      source="epicor" column="JobAsmbl_RevisionNum"/>
      <etiq:field name="Qty"      source="prompt" caption="Piece Count (PCS):" mask="99999"/>
      <etiq:field name="Serial"   source="serial" counter="ACME" format="000000" increment="1"/>
      <etiq:field name="Date"     source="auto"   value="date:dd-MMM-yyyy"/>
      <etiq:field name="Address"  source="fixed"  value="100 EXAMPLE AVE, SPRINGFIELD, IL 62701"/>
    </etiq:label>
  </metadata>

  <!-- static frame -->
  <rect x="42" y="42" width="5917" height="3917" fill="none" stroke="black" stroke-width="21"/>
  <line x1="42" y1="1000" x2="5958" y2="1000" stroke="black" stroke-width="10"/>
  <text x="167" y="292" font-family="Arial" font-size="146" font-weight="bold">CONTAINER I.D.</text>
  <text x="167" y="917" font-family="Arial" font-size="104" data-field="Address">100 EXAMPLE AVE, SPRINGFIELD, IL 62701</text>

  <!-- dynamic text -->
  <text x="167"  y="1458" font-family="Arial" font-size="125">PART NO (P)</text>
  <text x="1458" y="1458" font-family="Arial" font-size="229" font-weight="bold"
        data-field="PartNo">SAMPLE-PART-123</text>
  <text x="167"  y="1875" font-family="Arial" font-size="125">CUSTOMER</text>
  <text x="1458" y="1875" font-family="Arial" font-size="167"
        data-field="Customer" data-transform="upper,trim">Sample Customer</text>
  <text x="167"  y="2292" font-family="Arial" font-size="125">QTY (Q)</text>
  <text x="1458" y="2292" font-family="Arial" font-size="229" font-weight="bold"
        data-field="Qty" data-format="number:0">500</text>
  <text x="3750" y="2292" font-family="Arial" font-size="125">DATE</text>
  <text x="4375" y="2292" font-family="Arial" font-size="146"
        data-field="Date">01-JAN-2026</text>
  <text x="3750" y="1458" font-family="Arial" font-size="125">REV</text>
  <text x="4375" y="1458" font-family="Arial" font-size="146" data-field="Rev">B</text>

  <!-- barcodes -->
  <rect x="1458" y="2500" width="3125" height="583"
        data-barcode="code128" data-field="Serial" data-hri="below"
        data-module-mils="13"/>
  <text x="167" y="2833" font-family="Arial" font-size="125">SERIAL (3S)</text>
  <rect x="4792" y="2500" width="1000" height="1000"
        data-barcode="qr" data-field="JobNum"/>
</svg>
